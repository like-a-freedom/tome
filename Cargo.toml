[package]
name = "tome"
version = "0.9.0"
edition = "2024"
resolver = "3"
description = "Minimal CLI for managing AI agent skills"
license = "MIT"
repository = "https://github.com/like-a-freedom/tome"
keywords = ["cli", "ai", "skills", "agents"]
categories = ["command-line-utilities"]

[[bin]]
name = "tome"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
chrono = { version = "0.4.45", features = ["serde", "clock"], default-features = false }
tempfile = "3.27.0"
crossterm = "0.29.0"
unicode-width = { version = "0.2.2", default-features = false }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"
